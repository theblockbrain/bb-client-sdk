name: Canary release

# Publishes a pre-release build under the `canary` dist-tag so consumers (e.g. the
# Outlook add-in) can test an SDK change BEFORE it's cut as a real `latest` release.
#
# Trigger: add the `release:canary` label to a PR (or run manually via the Actions tab).
# It never touches `latest` — real consumers on the stable tag are unaffected.
# Uses the built-in GITHUB_TOKEN (packages:write) — no personal token / admin needed.

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

jobs:
  canary:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'release:canary' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://npm.pkg.github.com"
          scope: "@theblockbrain"

      - run: npm ci

      # Quick gate so we never publish a broken canary
      - run: npm run typecheck
      - run: npm run build

      - name: Set canary version (0.0.0-canary.<sha>, not committed)
        id: ver
        run: |
          SHA="$(git rev-parse --short HEAD)"
          VERSION="0.0.0-canary.${SHA}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish under the `canary` dist-tag
        run: npm publish --tag canary
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment install instructions on the PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const version = "${{ steps.ver.outputs.version }}";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                "🐤 **Canary published** — test this change in a consumer without a real release:",
                "```bash",
                `npm install @theblockbrain/bb-client-sdk@${version}`,
                "# …or the moving tag that always points at the newest canary:",
                "npm install @theblockbrain/bb-client-sdk@canary",
                "```",
                "This build is under the `canary` dist-tag and never becomes `latest`.",
              ].join("\n"),
            });

  # Notify consumer repos so their CI installs @canary and builds against it.
  # DORMANT until an org GitHub App is wired up (needs admin): the default
  # GITHUB_TOKEN cannot trigger workflows in another repo, so this job only runs
  # once `vars.CONSUMER_DISPATCH_ENABLED == 'true'` and uses the App token in
  # `secrets.CONSUMER_DISPATCH_TOKEN`. See PDEV-6806 (GitHub App setup).
  notify-consumers:
    name: Notify consumer repos
    needs: canary
    if: ${{ vars.CONSUMER_DISPATCH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    # Uses only the App token (GH_TOKEN below), never the default GITHUB_TOKEN, and has
    # no checkout — so the automatic token needs zero scopes.
    permissions: {}
    steps:
      - name: Dispatch sdk-canary event to each consumer
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
          VERSION: ${{ needs.canary.outputs.version }}
          CONSUMERS: ${{ vars.CONSUMER_REPOS }}
        run: |
          CONSUMERS="${CONSUMERS:-ms-outlook-addin}"
          for repo in ${CONSUMERS//,/ }; do
            echo "→ dispatch sdk-canary to theblockbrain/${repo} (version ${VERSION})"
            gh api --method POST "repos/theblockbrain/${repo}/dispatches" \
              --input <(jq -nc --arg v "$VERSION" '{event_type:"sdk-canary",client_payload:{version:$v}}')
          done
