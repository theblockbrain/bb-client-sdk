name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - name: Lint (Biome)
        run: npm run lint:biome

      - name: Lint (ESLint — type-aware)
        run: npm run lint:types

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck against the React peer floor (18)
        # The `react` peer is `>=18 <20`. Without this the floor is a claim, not a
        # fact — nothing else in CI ever compiles against React 18. `--no-save`
        # keeps the dev pin on 19 for every other step.
        run: |
          npm install --no-save --silent react@18.3.1 react-dom@18.3.1 \
            @types/react@18.3.12 @types/react-dom@18.3.1
          npm run typecheck
          npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package contract (publint + attw)
        run: npm run check:package

      - name: Clean-room install + bare-Node import gate
        run: npm run check:cleanroom
