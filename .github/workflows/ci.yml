name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - name: Lint (Biome)
        run: npm run lint:biome

      - name: Lint (ESLint — type-aware)
        run: npm run lint:types

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Package contract (publint + attw)
        run: npm run check:package
